<svg xmlns="http://www.w3.org/2000/svg" width="830" height="230" viewBox="0 0 830 230" role="img" aria-label="Harikishore Anem. AI engineer. Vision, voice, language." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="c" x1="0" x2="1"><stop offset="0" stop-color="#f3e3b8"/><stop offset="1" stop-color="#b8924d"/></linearGradient>
<clipPath id="k"><rect width="830" height="230" rx="16"/></clipPath></defs>
<style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.sf{font-family:Georgia,'Times New Roman',serif}
.a{animation:br 6s ease-in-out infinite}@keyframes br{50%{opacity:.25}}
