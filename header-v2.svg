<line x1="52" y1="138" x2="172" y2="138" stroke="#c9a96e"/>
<g font-size="13" letter-spacing="4" fill="#a9c3b8"><text class="t" x="52" y="172">AI ENGINEER · REAL-TIME VISION AND VOICE</text><text class="t" style="animation-delay:3s" x="52" y="172">I TEACH MACHINES TO SEE AND TO LISTEN</text><text class="t" style="animation-delay:6s" x="52" y="172">OPEN TO WORK</text></g>
