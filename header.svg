<svg xmlns="http://www.w3.org/2000/svg" width="830" height="240" viewBox="0 0 830 240" role="img" aria-label="Harikishore Anem. I teach machines to see and to listen." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><radialGradient id="ir" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#9fd0ff"/><stop offset=".6" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d3f91"/></radialGradient></defs>
<style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.look{animation:look 4s ease-in-out infinite alternate}
@keyframes look{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.t{opacity:0;animation:cy 9s infinite}
@keyframes cy{0%{opacity:0}5%,30%{opacity:1}35%,100%{opacity:0}}
.b{transform-box:fill-box;transform-origin:center bottom;animation:wv 1.2s ease-in-out infinite alternate}
@keyframes wv{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.dot{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
</style>
<rect x="1" y="1" width="828" height="238" rx="16" fill="#0d1117" stroke="#30363d"/>
<g class="eye"><path d="M28 112 Q108 34 188 112 Q108 190 28 112Z" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
<g class="look"><circle cx="108" cy="112" r="34" fill="url(#ir)"/><circle cx="108" cy="112" r="15" fill="#0d1117"/><circle cx="98" cy="102" r="6" fill="#fff" opacity=".85"/></g></g>
<text x="222" y="92" font-size="48" font-weight="800" fill="#ffffff">Harikishore Anem</text>
<g font-size="24" fill="#9fb0c3"><text class="t" x="222" y="138">I teach machines to <tspan fill="#58a6ff" font-weight="700">see</tspan>.</text>
<text class="t" style="animation-delay:3s" x="222" y="138">I teach machines to <tspan fill="#58a6ff" font-weight="700">listen</tspan>.</text>
<text class="t" style="animation-delay:6s" x="222" y="138">I turn noisy data into <tspan fill="#58a6ff" font-weight="700">working AI</tspan>.</text></g>
